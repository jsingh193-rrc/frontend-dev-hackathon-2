<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="main-section">
            <h1>Capture Your Moments</h1>
            <p>Professional photography that tells your story</p>
            <button class="book-btn">Book a Session</button>
        </section>
        <section class="services">
            <h2>Our Services</h2>
            <div class="service-grid">
                <div class="service">
                    <img src="img/photographyyyy.jpg" alt="Wedding photography">
                    <h3>Wedding</h3>
                    <p>Capturing your wedding day</p>
                </div>
                <div class="service">
                    <img src="img/photographyyyy.jpg" alt="Portrait photography">
                    <h3>Portrait</h3>
                    <p>Professional portrait pictures</p>
                </div>
                <div class="service">
                    <img src="img/photographyyyy.jpg" alt="Event photography">
                    <h3>Events</h3>
                    <p>Special occasions</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
